name: Build y Release NexoKit R9

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'version.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar Desktop self-contained
        shell: pwsh
        run: |
          dotnet restore Desktop/KitHerramientas.Desktop.csproj
          dotnet publish Desktop/KitHerramientas.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o out/desktop
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item out/desktop/KitHerramientas.exe artifacts/NexoKit_Desktop_0.9.0_R9.exe

      - name: Subir artifact Desktop
        uses: actions/upload-artifact@v4
        with:
          name: NexoKit-Desktop-R9
          path: artifacts/NexoKit_Desktop_0.9.0_R9.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-37'

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK instalable
        shell: bash
        run: |
          gradle -p Android :app:assembleDebug --no-daemon
          mkdir -p artifacts
          cp Android/app/build/outputs/apk/debug/app-debug.apk artifacts/NexoKit_Android_0.9.0_R9.apk

      - name: Subir artifact Android
        uses: actions/upload-artifact@v4
        with:
          name: NexoKit-Android-R9
          path: artifacts/NexoKit_Android_0.9.0_R9.apk
          if-no-files-found: error

  release:
    name: Crear Release v0.9.0
    runs-on: ubuntu-latest
    needs: [desktop, android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Empaquetar fuente y checksums
        shell: bash
        run: |
          git archive --format=zip --output release-assets/NexoKit_Source_R9.zip HEAD -- . ':(exclude).bootstrap'
          cd release-assets
          sha256sum NexoKit_Desktop_0.9.0_R9.exe NexoKit_Android_0.9.0_R9.apk NexoKit_Source_R9.zip > SHA256SUMS.txt
          ls -lah

      - name: Crear/actualizar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0
          target_commitish: ${{ github.sha }}
          name: NexoKit R9 · v0.9.0
          body: |
            NexoKit R9 — Desktop + Android.

            Incluye:
            - Wi-Fi Sensing experimental.
            - Kit de red y laboratorio RSSI.
            - Actualizaciones independientes por repositorio.
            - Descubrir catálogos OSINT.
            - Meta Scan seguido como herramienta OSINT.

            Archivos:
            - NexoKit_Desktop_0.9.0_R9.exe
            - NexoKit_Android_0.9.0_R9.apk
            - NexoKit_Source_R9.zip
            - SHA256SUMS.txt

            El APK de esta revisión usa firma debug para pruebas. Las herramientas descargadas por NexoKit nunca se ejecutan automáticamente.
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/NexoKit_Desktop_0.9.0_R9.exe
            release-assets/NexoKit_Android_0.9.0_R9.apk
            release-assets/NexoKit_Source_R9.zip
            release-assets/SHA256SUMS.txt
